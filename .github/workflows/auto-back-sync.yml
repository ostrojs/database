name: Direct Master to Dev Sync (ostrojs & amarksingh)

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  direct-sync:
    name: Direct Sync master -> dev (ostrojs & amarksingh)
    runs-on: ubuntu-latest

    # Prevent loop if commit message contains [skip sync] or is from bot
    if: |
      !contains(github.event.head_commit.message, '[skip sync]') &&
      github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Direct Sync master -> dev in ostrojs
        run: |
          echo "=== Direct Sync master -> dev on ostrojs/${{ github.event.repository.name }} ==="
          git fetch origin dev 2>/dev/null || true
          git checkout dev 2>/dev/null || git checkout -b dev origin/dev 2>/dev/null || true
          
          echo "--> Merging master into dev..."
          git merge master --no-edit -X theirs || git rebase master || true
          
          echo "--> Pushing dev to ostrojs/${{ github.event.repository.name }}..."
          git push origin dev || git push origin dev --force-with-lease

      - name: Direct Sync / Push dev to amarksingh (Fork)
        env:
          CROSS_REPO_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          FORK_REPO: "amarksingh/${{ github.event.repository.name }}"
          FORK_BRANCH: "dev"
        run: |
          echo "=== Direct Sync to Fork $FORK_REPO ($FORK_BRANCH) ==="
          # Try GitHub gh repo sync API first
          gh repo sync "$FORK_REPO" --branch "$FORK_BRANCH" --source "ostrojs/${{ github.event.repository.name }}" || {
            echo "--> Fast-forwarding / pushing directly to $FORK_REPO..."
            git remote add fork "https://x-access-token:${CROSS_REPO_TOKEN}@github.com/${FORK_REPO}.git" 2>/dev/null || git remote set-url fork "https://x-access-token:${CROSS_REPO_TOKEN}@github.com/${FORK_REPO}.git"
            git push fork dev:dev || git push fork dev:dev --force-with-lease
          }
