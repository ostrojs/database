name: Smart Sync (ostrojs & amarksingh)

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    types: [closed]
    branches:
      - dev
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  smart-sync:
    name: Conditional Sync & Auto-Merge Workflow
    runs-on: ubuntu-latest

    # Prevent loop if commit message contains [skip sync] or is from bot
    if: |
      !contains(github.event.head_commit.message, '[skip sync]') &&
      github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Dynamic Repository, PR & Branch Context Check
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          IS_MERGED: ${{ github.event.pull_request.merged }}
          CROSS_REPO_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "=================================================="
          echo "Repository Owner : $REPO_OWNER"
          echo "Repository Name  : $REPO_NAME"
          echo "Event Name       : $EVENT_NAME"
          echo "Triggered Branch : $REF_NAME"
          echo "PR Merged        : $IS_MERGED"
          echo "=================================================="

          if [ "$REPO_OWNER" == "ostrojs" ]; then
            if [ "$EVENT_NAME" == "pull_request" ] && [ "$IS_MERGED" == "true" ]; then
              echo "--> [PR MERGED EVENT ON OSTROJS] Auto-syncing ostrojs/master -> ostrojs/dev..."
              git fetch origin dev 2>/dev/null || true
              git checkout dev 2>/dev/null || git checkout -b dev origin/dev 2>/dev/null || true
              git merge master --no-edit -X theirs || git rebase master || true
              git push origin dev || git push origin dev --force-with-lease

              echo "--> Auto-syncing ostrojs -> amarksingh/dev..."
              gh repo sync "amarksingh/$REPO_NAME" --branch "dev" --source "ostrojs/$REPO_NAME" || {
                git remote add fork "https://x-access-token:${CROSS_REPO_TOKEN}@github.com/amarksingh/${REPO_NAME}.git" 2>/dev/null || true
                git push fork dev:dev || git push fork dev:dev --force-with-lease
              }
            elif [ "$REF_NAME" == "master" ]; then
              echo "--> [OSTROJS MASTER PUSH EVENT] Syncing ostrojs/master -> ostrojs/dev & amarksingh/dev..."
              git fetch origin dev 2>/dev/null || true
              git checkout dev 2>/dev/null || git checkout -b dev origin/dev 2>/dev/null || true
              git merge master --no-edit -X theirs || git rebase master || true
              git push origin dev || git push origin dev --force-with-lease
              
              gh repo sync "amarksingh/$REPO_NAME" --branch "dev" --source "ostrojs/$REPO_NAME" || true
            fi
          else
            echo "--> [FORK EVENT ($REPO_OWNER)] Syncing ostrojs/dev -> $REPO_OWNER/dev..."
            gh repo sync "$REPO_OWNER/$REPO_NAME" --branch "dev" --source "ostrojs/$REPO_NAME" || true
          fi
